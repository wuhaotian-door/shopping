<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>码上非遗 · AI 助手</title>
<style>
  :root {
    --bg: #f5f0e8; --card: #fff; --primary: #8b4513; --primary-light: #a0522d;
    --accent: #d4a574; --text: #3e2723; --muted: #8d6e63;
    --bubble-user: #8b4513; --bubble-ai: #fff8f0; --border: #e0d5c7;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; min-height:100vh; }
  .container { width:100%; max-width:860px; min-height:100vh; display:flex; background:var(--card); box-shadow:0 0 40px rgba(139,69,19,0.08); }

  /* 侧栏 */
  .sidebar { width:240px; border-right:1px solid var(--border); display:flex; flex-direction:column; background:#fefaf7; flex-shrink:0; }
  .sidebar-header { padding:16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .sidebar-header h3 { font-size:15px; color:var(--primary); cursor:pointer; }
  .btn-new { width:28px; height:28px; border:1px solid var(--border); background:#fff; border-radius:8px; cursor:pointer; font-size:18px; color:var(--primary); }
  .btn-new:hover { background:var(--accent); color:#fff; }
  .session-list { flex:1; overflow-y:auto; }
  .session-item { display:flex; align-items:center; padding:12px 16px; cursor:pointer; border-bottom:1px solid rgba(139,69,19,0.06); gap:8px; transition:0.2s; }
  .session-item:hover { background:rgba(139,69,19,0.04); }
  .session-item.active { background:rgba(139,69,19,0.08); border-left:3px solid var(--primary); }
  .session-title { flex:1; font-size:13px; color:#555; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .session-item.active .session-title { color:var(--primary); font-weight:600; }
  .btn-del { width:18px; height:18px; border:none; background:transparent; color:#ccc; cursor:pointer; font-size:12px; border-radius:50%; }
  .btn-del:hover { color:var(--primary); background:rgba(139,69,19,0.1); }

  /* 主区 */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .main-header { padding:14px 20px; border-bottom:1px solid var(--border); font-size:15px; font-weight:600; color:var(--primary); background:#fff; }
  .msgs { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msgs:empty::after { content:"✨ 问我任何关于非遗的问题\n如：苏绣有什么特点？推荐一些适合新手的非遗？"; white-space:pre-wrap; text-align:center; color:var(--muted); margin:auto; font-size:14px; line-height:1.8; }

  .bubble { max-width:78%; padding:12px 18px; border-radius:16px; font-size:14px; line-height:1.7; animation:up 0.3s; }
  @keyframes up { from{opacity:0;transform:translateY(8px);} }
  .msg-user { align-self:flex-end; }
  .msg-user .bubble { background:var(--bubble-user); color:#fff; border-bottom-right-radius:4px; }
  .msg-ai { align-self:flex-start; }
  .msg-ai .bubble { background:var(--bubble-ai); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg-ai .sources { margin-top:8px; padding-top:6px; border-top:1px dashed var(--border); font-size:11px; color:var(--muted); }
  .tool-note { align-self:flex-start; font-size:11px; color:var(--muted); padding:4px 12px; background:#f0ebe3; border-radius:10px; }

  .input-bar { display:flex; gap:10px; padding:14px 20px; border-top:1px solid var(--border); background:#fdfbf7; }
  .input-bar input { flex:1; padding:10px 16px; border:1px solid var(--border); border-radius:22px; font-size:14px; outline:none; background:#fff; font-family:inherit; }
  .input-bar input:focus { border-color:var(--accent); }
  .input-bar button { padding:10px 24px; border:none; background:var(--primary); color:#fff; border-radius:22px; cursor:pointer; font-size:14px; font-weight:500; }
  .input-bar button:hover { background:var(--primary-light); }
  .input-bar button:disabled { background:#ccc; }

  @media(max-width:768px) { .container { flex-direction:column; } .sidebar { width:100%; max-height:160px; } }
</style>
</head>
<body>
<div class="container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3 onclick="newSession()">💬 对话</h3>
      <button class="btn-new" onclick="newSession()" title="新建">＋</button>
    </div>
    <div class="session-list" id="sessions"></div>
  </aside>

  <main class="main">
    <div class="main-header">🤖 AI 智能助手</div>
    <div class="msgs" id="msgs"></div>
    <div class="input-bar">
      <input id="input" placeholder="输入你的问题…" autofocus onkeydown="if(event.key==='Enter')send()">
      <button id="btn" onclick="send()">发送</button>
    </div>
  </main>
</div>

<script>
let tid = localStorage.getItem('ai_tid') || 'session-'+Date.now()
localStorage.setItem('ai_tid', tid)
let streaming = false

async function loadSessions() {
  const r = await fetch('/ai/sessions'); const d = await r.json()
  const el = document.getElementById('sessions')
  el.innerHTML = d.sessions.map(s => `<div class="session-item${s.id===tid?' active':''}" onclick="switchTo('${s.id}')"><span class="session-title">${s.title||'新会话'}</span><button class="btn-del" onclick="event.stopPropagation();delSession('${s.id}')">×</button></div>`).join('')
}
function newSession() { tid='session-'+Date.now(); localStorage.setItem('ai_tid',tid); document.getElementById('msgs').innerHTML=''; loadSessions() }
function switchTo(id) { tid=id; localStorage.setItem('ai_tid',tid); document.getElementById('msgs').innerHTML=''; loadHistory() }
async function delSession(id) { await fetch('/ai/sessions/'+id,{method:'DELETE'}); if(id===tid) newSession(); loadSessions() }

async function loadHistory() {
  const r = await fetch('/ai/sessions'); const d = await r.json()
  const s = d.sessions.find(s=>s.id===tid)
  // TODO: load full messages from session file — for now just show empty
}

async function send() {
  const inp = document.getElementById('input'), q = inp.value.trim()
  if(!q || streaming) return; inp.value=''; streaming=true
  document.getElementById('btn').disabled=true

  addMsg('user', q)
  const aiDiv = addMsg('ai', '')
  let buf = ''

  try {
    const r = await fetch('/ai/chat/stream', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,thread_id:tid})})
    const reader = r.body.getReader(), dec = new TextDecoder()
    let leftover = ''
    while(true) {
      const {done, value} = await reader.read()
      if(done) break
      leftover += dec.decode(value,{stream:true})
      const lines = leftover.split('\n'); leftover = lines.pop()||''
      for(const line of lines) {
        if(line==='data: [DONE]') continue
        if(!line.startsWith('data: ')) continue
        try {
          const d = JSON.parse(line.slice(6))
          if(d.type==='token') { buf += d.content; aiDiv.querySelector('.content').textContent = buf }
          else if(d.type==='tool_start') addTool(d.name, d.input)
        } catch(e){}
      }
    }
  } catch(e) { aiDiv.querySelector('.content').textContent = '错误: '+e.message }
  finally { streaming=false; document.getElementById('btn').disabled=false; inp.focus(); loadSessions() }
}

function addMsg(role, text) {
  const d = document.createElement('div'); d.className = 'msg-'+role
  d.innerHTML = `<div class="bubble"><div class="content">${text||''}</div></div>`
  document.getElementById('msgs').appendChild(d)
  document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight
  return d
}
function addTool(name, args) {
  const d = document.createElement('div'); d.className='tool-note'
  d.textContent = `🔧 ${name}(${JSON.stringify(args).slice(0,80)}…)`
  document.getElementById('msgs').appendChild(d)
}

loadSessions()
</script>
</body>
</html>
