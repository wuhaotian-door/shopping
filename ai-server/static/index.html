<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>码上非遗 — AI 问答</title>
<style>
  :root {
    --bg: #f5f0e8;
    --card: #fff;
    --primary: #8b4513;
    --primary-light: #a0522d;
    --accent: #d4a574;
    --text: #3e2723;
    --muted: #8d6e63;
    --bubble-user: #8b4513;
    --bubble-ai: #fff8f0;
    --border: #e0d5c7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 800px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--card);
    box-shadow: 0 0 40px rgba(139,69,19,0.08);
  }

  /* ---- Header ---- */
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, #faf6f0, #fff);
  }
  header .icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ---- Chat area ---- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .chat:empty::after {
    content: "✨ 问我任何关于非遗的问题\n如：什么是景泰蓝？蜀绣有哪些针法？";
    white-space: pre-wrap;
    text-align: center;
    color: var(--muted);
    margin: auto;
    font-size: 14px;
    line-height: 1.8;
  }

  /* ---- Bubbles ---- */
  .bubble {
    max-width: 80%;
    padding: 12px 18px;
    border-radius: 18px;
    line-height: 1.7;
    font-size: 15px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }

  .bubble.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.ai {
    align-self: flex-start;
    background: var(--bubble-ai);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble.ai.loading {
    color: var(--muted);
    font-style: italic;
  }

  /* ---- Input area ---- */
  footer {
    padding: 16px 24px 24px;
    border-top: 1px solid var(--border);
    background: #fafaf8;
  }
  .input-row {
    display: flex;
    gap: 10px;
  }
  .input-row input {
    flex: 1;
    padding: 12px 18px;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    background: var(--card);
    font-family: inherit;
  }
  .input-row input:focus { border-color: var(--accent); }

  .input-row button {
    padding: 12px 24px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
    border: none;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    font-family: inherit;
    white-space: nowrap;
  }
  .input-row button:hover { opacity: 0.9; }
  .input-row button:active { transform: scale(0.97); }
  .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

  footer .hint {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  /* ---- Mode Toggle ---- */
  .toggle {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: var(--card);
    color: var(--muted);
    transition: all 0.2s;
    font-family: inherit;
  }
  .toggle.on  { background: var(--primary); color: #fff; border-color: var(--primary); }
  .toggle.off { background: var(--card); color: var(--muted); }
  .toggle.enhanced { background: #d4a574; color: #fff; border-color: #d4a574; }

  /* ---- Streaming cursor ---- */
  .bubble.streaming { border-right: none; }
  .cursor {
    display: inline;
    animation: blink 0.8s infinite;
    color: var(--primary);
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  /* ---- Enhanced response: keywords ---- */
  .keywords-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .keywords-row .tag {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 10px;
    background: #fef3e4;
    color: #a0522d;
    border: 1px solid #f0d8b0;
  }

  /* ---- Enhanced response: suggests ---- */
  .suggests-row {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .suggests-row .card {
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 10px;
    background: #fdfaf5;
    border: 1px solid var(--border);
    line-height: 1.5;
  }
  .suggests-row .card strong { color: var(--primary); }

  .section-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 8px;
    margin-bottom: 2px;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header>
    <div class="icon">🏛️</div>
    <div>
      <h1>码上非遗 · AI 问答</h1>
      <p>基于 LangChain + DeepSeek 的非遗知识助手</p>
    </div>
  </header>

  <!-- Chat messages -->
  <div class="chat" id="chat"></div>

  <!-- Input -->
  <footer>
    <div class="input-row">
      <input
        id="question"
        type="text"
        placeholder="输入你想了解的非遗问题…"
        autocomplete="off"
        autofocus
      />
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
    <p class="hint">
      <button id="modeToggle" class="toggle on">⚡ 流式</button>
      <span>支持: 非遗项目介绍 · 技艺历史 · 传承人故事 · 传统文化知识</span>
    </p>
  </footer>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('question');
const btn   = document.getElementById('sendBtn');
const modeToggle = document.getElementById('modeToggle');

// 三种模式: 'stream' | 'normal' | 'enhanced'
let mode = 'stream';

const MODES = {
  stream:   { label: '⚡ 流式',    cls: 'toggle on' },
  normal:   { label: '📦 一次性',  cls: 'toggle off' },
  enhanced: { label: '🧠 增强',    cls: 'toggle enhanced' },
};

modeToggle.addEventListener('click', () => {
  const keys = Object.keys(MODES);
  const idx = keys.indexOf(mode);
  mode = keys[(idx + 1) % keys.length];
  const m = MODES[mode];
  modeToggle.textContent = m.label;
  modeToggle.className = m.cls;
});

input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function send() {
  const question = input.value.trim();
  if (!question) return;

  addBubble(question, 'user');
  input.value = '';
  btn.disabled = true;

  if (mode === 'enhanced') {
    await sendEnhanced(question);
  } else if (mode === 'stream') {
    await sendStream(question);
  } else {
    await sendNormal(question);
  }

  btn.disabled = false;
  input.focus();
}

// =============================================
// Day 1: 普通请求
// =============================================
async function sendNormal(question) {
  const loading = addBubble('▊ 思考中…', 'ai loading');
  try {
    const res = await fetch('/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    loading.remove();
    addBubble(data.answer, 'ai');
  } catch (err) {
    loading.remove();
    addBubble('请求失败，请确认服务已启动。', 'ai');
  }
}

// =============================================
// Day 3: 流式请求
// =============================================
async function sendStream(question) {
  const bubble = addBubble('', 'ai streaming');
  bubble.innerHTML = '<span class="cursor">▊</span>';

  try {
    const res = await fetch('/ai/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);

        if (payload === '[DONE]') {
          const cursor = bubble.querySelector('.cursor');
          if (cursor) cursor.remove();
          bubble.classList.remove('streaming');
          return;
        }

        try {
          const { token } = JSON.parse(payload);
          const cursor = bubble.querySelector('.cursor');
          cursor.insertAdjacentText('beforebegin', token);
        } catch (e) { /* ignore */ }
      }
    }
  } catch (err) {
    const cursor = bubble.querySelector('.cursor');
    if (cursor) cursor.remove();
    bubble.classList.remove('streaming');
    bubble.textContent += ' [连接中断]';
  }
}

// =============================================
// Day 6: 增强模式 — RunnableParallel 一次获取答案+关键词+推荐
// =============================================
async function sendEnhanced(question) {
  const loading = addBubble('▊ 正在查资料、提取关键词、找相关推荐…', 'ai loading');
  try {
    const res = await fetch('/ai/chat/v2', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    loading.remove();

    // 构建增强气泡: 答案 + 关键词标签 + 推荐卡片
    const bubble = document.createElement('div');
    bubble.className = 'bubble ai';
    bubble.style.maxWidth = '90%';

    let html = '<div>' + escapeHtml(data.answer) + '</div>';

    // 关键词标签
    if (data.keywords && data.keywords.length > 0) {
      html += '<div class="section-label">🏷️ 关键词</div>';
      html += '<div class="keywords-row">';
      for (const kw of data.keywords) {
        html += '<span class="tag">' + escapeHtml(kw) + '</span>';
      }
      html += '</div>';
    }

    // 推荐项目
    if (data.suggests && data.suggests.length > 0) {
      html += '<div class="section-label">📌 相关非遗项目</div>';
      html += '<div class="suggests-row">';
      for (const s of data.suggests) {
        html += '<div class="card"><strong>' + escapeHtml(s.name) + '</strong> — ' + escapeHtml(s.desc) + '</div>';
      }
      html += '</div>';
    }

    bubble.innerHTML = html;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
  } catch (err) {
    loading.remove();
    addBubble('请求失败，请确认服务已启动。', 'ai');
  }
}

function addBubble(text, className) {
  const div = document.createElement('div');
  div.className = 'bubble ' + className;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>

</body>
</html>
