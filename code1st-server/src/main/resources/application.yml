server:
  port: 8080

spring:
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${code1st.datasource.driver-class-name}
      url: jdbc:mysql://${code1st.datasource.host}:${code1st.datasource.port}/${code1st.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${code1st.datasource.username}
      password: ${code1st.datasource.password}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.class242014group06.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      class242014group06:
        mapper: debug
        service: info
        controller: info

code1st:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 31536000000
    # 设置前端传递过来的令牌名称
    admin-token-name: token


